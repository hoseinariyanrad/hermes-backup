terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180
compression:
  enabled: true
  threshold: 0.85
command_allowlist:
  - script execution via -e/-c flag
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
_config_version: 38
model:
  default: hermes
  provider: openai-api
  context_length: 256000
